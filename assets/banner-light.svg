<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="320" viewBox="0 0 1200 320" role="img" aria-labelledby="title desc">
  <title id="title">Noman Ahmad — Senior Mobile Software Engineer</title>
  <desc id="desc">Banner with Noman's name and role, beside an illustrated phone with a scrolling feed and an App Store Connect notification.</desc>
  <style>
    .sans { font-family: Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; }
    .mono { font-family: 'JetBrains Mono', ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }
    .feed { animation: scroll 16s linear infinite; }
    .toast { animation: toast 9s cubic-bezier(0.22, 1, 0.36, 1) infinite; }
    .ping { transform-box: fill-box; transform-origin: center; animation: ping 2.4s cubic-bezier(0, 0, 0.2, 1) infinite; }
    .drift-a { animation: drift-a 18s ease-in-out infinite alternate; }
    .drift-b { animation: drift-b 22s ease-in-out infinite alternate; }
    @keyframes scroll { to { transform: translateY(-330px); } }
    @keyframes toast {
      0%, 8% { opacity: 0; transform: translateY(-14px) scale(0.96); }
      14%, 62% { opacity: 1; transform: translateY(0) scale(1); }
      70%, 100% { opacity: 0; transform: translateY(-14px) scale(0.96); }
    }
    @keyframes ping { 0% { opacity: 0.55; transform: scale(1); } 80%, 100% { opacity: 0; transform: scale(2.6); } }
    @keyframes drift-a { to { transform: translate(-60px, 24px); } }
    @keyframes drift-b { to { transform: translate(50px, -30px); } }
    @media (prefers-reduced-motion: reduce) {
      .feed, .toast, .ping, .drift-a, .drift-b { animation: none; }
    }
  </style>
  <defs>
    <clipPath id="card"><rect width="1200" height="320" rx="24"/></clipPath>
    <clipPath id="screen"><rect x="893" y="53" width="196" height="322" rx="30"/></clipPath>
    <radialGradient id="blob-a"><stop offset="0" stop-color="rgba(91,61,245,0.20)"/><stop offset="1" stop-color="rgba(91,61,245,0.20)" stop-opacity="0"/></radialGradient>
    <radialGradient id="blob-b"><stop offset="0" stop-color="rgba(6,182,212,0.16)"/><stop offset="1" stop-color="rgba(6,182,212,0.16)" stop-opacity="0"/></radialGradient>
    <radialGradient id="blob-c"><stop offset="0" stop-color="rgba(168,85,247,0.13)"/><stop offset="1" stop-color="rgba(168,85,247,0.13)" stop-opacity="0"/></radialGradient>
    <linearGradient id="brand" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#5b3df5"/><stop offset="1" stop-color="#06b6d4"/></linearGradient>
    <linearGradient id="avatar" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#5b3df5"/><stop offset="1" stop-color="#06b6d4"/></linearGradient>
    <linearGradient id="media" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="rgba(91,61,245,0.20)"/><stop offset="1" stop-color="rgba(6,182,212,0.18)"/></linearGradient>
    <linearGradient id="media2" x1="1" y1="0" x2="0" y2="1"><stop offset="0" stop-color="rgba(6,182,212,0.18)"/><stop offset="1" stop-color="rgba(91,61,245,0.20)"/></linearGradient>
    <linearGradient id="fade" x1="0" y1="0" x2="1" y2="0"><stop offset="0.35" stop-color="#fff" stop-opacity="0"/><stop offset="1" stop-color="#fff"/></linearGradient>
    <mask id="dots-mask"><rect width="1200" height="320" fill="url(#fade)"/></mask>
    <pattern id="dots" width="22" height="22" patternUnits="userSpaceOnUse"><circle cx="2" cy="2" r="1.2" fill="#131319" fill-opacity="0.07"/></pattern>
    <filter id="shadow" x="-20%" y="-30%" width="140%" height="190%"><feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="rgba(16,16,32,0.14)"/></filter>
  </defs>

  <g clip-path="url(#card)">
    <rect width="1200" height="320" fill="#ffffff"/>
    <circle class="drift-a" cx="980" cy="30" r="300" fill="url(#blob-a)"/>
    <circle class="drift-b" cx="1150" cy="320" r="240" fill="url(#blob-b)"/>
    <circle class="drift-b" cx="120" cy="360" r="260" fill="url(#blob-c)"/>
    <rect width="1200" height="320" fill="url(#dots)" mask="url(#dots-mask)"/>

    <!-- Intro -->
    <g transform="translate(64 62)">
      <rect width="206" height="34" rx="17" fill="rgba(91,61,245,0.07)" stroke="rgba(91,61,245,0.22)"/>
      <circle class="ping" cx="20" cy="17" r="5" fill="#16a34a"/>
      <circle cx="20" cy="17" r="5" fill="#16a34a"/>
      <text x="34" y="22" class="mono" font-size="15" font-weight="500" fill="#46464f">Currently at Club</text>
    </g>
    <text x="60" y="176" class="sans" font-size="76" font-weight="800" letter-spacing="-2.5" fill="#131319">Noman Ahmad</text>
    <text x="64" y="224" class="sans" font-size="30" font-weight="600" letter-spacing="-0.4" fill="#46464f">Senior Mobile Software Engineer</text>
    <text x="64" y="268" class="mono" font-size="19" font-weight="500" fill="#5b3df5">React Native · Swift · SwiftUI · TypeScript</text>

    <!-- Phone -->
    <rect x="884" y="44" width="214" height="340" rx="40" fill="#131319" stroke="#2a2a36" stroke-width="2"/>
    <rect x="893" y="53" width="196" height="322" rx="30" fill="#f4f4f8"/>
    <g clip-path="url(#screen)">
      <g class="feed">
      <g transform="translate(906 103)">
        <rect width="170" height="98" rx="14" fill="#ffffff" stroke="#e6e6ee"/>
        <circle cx="19" cy="19" r="9" fill="url(#avatar)"/>
        <rect x="35" y="12" width="58" height="6" rx="3" fill="#e6e6ee"/>
        <rect x="35" y="22" width="38" height="5" rx="2.5" fill="#efeff5"/>
        <rect x="10" y="38" width="150" height="48" rx="9" fill="url(#media)"/>
      </g>
      <g transform="translate(906 213)">
        <rect width="170" height="98" rx="14" fill="#ffffff" stroke="#e6e6ee"/>
        <circle cx="19" cy="19" r="9" fill="url(#avatar)"/>
        <rect x="35" y="12" width="72" height="6" rx="3" fill="#e6e6ee"/>
        <rect x="35" y="22" width="38" height="5" rx="2.5" fill="#efeff5"/>
        <rect x="10" y="38" width="150" height="48" rx="9" fill="url(#media2)"/>
      </g>
      <g transform="translate(906 323)">
        <rect width="170" height="98" rx="14" fill="#ffffff" stroke="#e6e6ee"/>
        <circle cx="19" cy="19" r="9" fill="url(#avatar)"/>
        <rect x="35" y="12" width="86" height="6" rx="3" fill="#e6e6ee"/>
        <rect x="35" y="22" width="38" height="5" rx="2.5" fill="#efeff5"/>
        <rect x="10" y="38" width="150" height="48" rx="9" fill="url(#media)"/>
      </g>
      <g transform="translate(906 433)">
        <rect width="170" height="98" rx="14" fill="#ffffff" stroke="#e6e6ee"/>
        <circle cx="19" cy="19" r="9" fill="url(#avatar)"/>
        <rect x="35" y="12" width="58" height="6" rx="3" fill="#e6e6ee"/>
        <rect x="35" y="22" width="38" height="5" rx="2.5" fill="#efeff5"/>
        <rect x="10" y="38" width="150" height="48" rx="9" fill="url(#media)"/>
      </g>
      <g transform="translate(906 543)">
        <rect width="170" height="98" rx="14" fill="#ffffff" stroke="#e6e6ee"/>
        <circle cx="19" cy="19" r="9" fill="url(#avatar)"/>
        <rect x="35" y="12" width="72" height="6" rx="3" fill="#e6e6ee"/>
        <rect x="35" y="22" width="38" height="5" rx="2.5" fill="#efeff5"/>
        <rect x="10" y="38" width="150" height="48" rx="9" fill="url(#media2)"/>
      </g>
      <g transform="translate(906 653)">
        <rect width="170" height="98" rx="14" fill="#ffffff" stroke="#e6e6ee"/>
        <circle cx="19" cy="19" r="9" fill="url(#avatar)"/>
        <rect x="35" y="12" width="86" height="6" rx="3" fill="#e6e6ee"/>
        <rect x="35" y="22" width="38" height="5" rx="2.5" fill="#efeff5"/>
        <rect x="10" y="38" width="150" height="48" rx="9" fill="url(#media)"/>
      </g>
      </g>
      <rect x="893" y="53" width="196" height="44" fill="#f4f4f8"/>
    </g>
    <text x="919" y="80" class="sans" font-size="12" font-weight="600" fill="#131319">9:41</text>
    <rect x="957.0" y="65" width="68" height="20" rx="10" fill="#131319"/>
    <g transform="translate(1043 71)" fill="#131319">
      <rect x="0" y="4" width="3" height="5" rx="1"/><rect x="5" y="2" width="3" height="7" rx="1"/><rect x="10" y="0" width="3" height="9" rx="1"/>
      <rect x="18" y="0" width="19" height="9" rx="2.5" fill="none" stroke="#131319" stroke-opacity="0.45"/>
      <rect x="20" y="2" width="13" height="5" rx="1.2"/>
    </g>

    <!-- Notification -->
    <g class="toast">
      <g filter="url(#shadow)">
        <rect x="712" y="96" width="262" height="66" rx="18" fill="#ffffff" stroke="#e6e6ee"/>
      </g>
      <rect x="726" y="111" width="36" height="36" rx="10" fill="url(#brand)"/>
      <path d="M735.5 129.5l6 6 11-12" fill="none" stroke="#ffffff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
      <text x="774" y="126" class="sans" font-size="14" font-weight="700" fill="#131319">Ready for Distribution</text>
      <text x="774" y="146" class="sans" font-size="13" fill="#74748a">App Store Connect · now</text>
    </g>
  </g>
  <rect x="0.5" y="0.5" width="1199" height="319" rx="23.5" fill="none" stroke="#e6e6ee"/>
</svg>
